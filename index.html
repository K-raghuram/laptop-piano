<body class="piano">
    <h1 id="title" >Piano</h1>
    <h2 id="para">press the displayed keys to make sound</h2>
    <div class="container d-flex">
        <div class="row flex-row ">
            <div class="col-12 contact-justify-center ">
                <button class="q key m-1">q</button>
                <button class="w key m-1">w</button>
                <button class="e key m-1">e</button>
                <button class="r key m-1">r</button>
                <button class="t key m-1">t</button>
                <button class="y key m-1">y</button>
                <button class="u key m-1">u</button>
                <button class="i key m-1">i</button>
                <button class="o key m-1">o</button>
                <button class="p key m-1">p</button>
                <button class="a key m-1">a</button>
                <button class="s key m-1">s</button>
                <button class="d key m-1">d</button>
                <button class="f key m-1">f</button>
                <button class="g key m-1">g</button>
                <button class="h key m-1">h</button>
                <button class="j key m-1">j</button>
                <button class="k key m-1">k</button>
                <button class="l key m-1">l</button>
                <button class="z key m-1">z</button>
                <button class="x key m-1">x</button>
                <button class="c key m-1">c</button>
                <button class="v key m-1">v</button>
                <button class="b key m-1">b</button>
            </div> 
        </div>
    </div>

    <script src="index.js"></script>
